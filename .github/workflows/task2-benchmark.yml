name: task2 benchmark

on:
  pull_request:
    branches: [master]
    paths:
      - 'task2/**'
      - '.github/workflows/task2-benchmark.yml'

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: task2-benchmark-${{ github.head_ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: task2
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: task2/uv.lock

      - name: Set up Python
        run: uv python install 3.11

      - name: Install dependencies
        run: uv sync --frozen

      - name: Canary gate
        env:
          HEAD_REF: ${{ github.head_ref }}
        run: |
          set -euo pipefail
          SAFE_BRANCH=$(uv run python -c "import sys; from scripts.benchmark import sanitize_branch; print(sanitize_branch(sys.argv[1]))" "$HEAD_REF")
          RESULTS_FILE="benchmark/${SAFE_BRANCH}/results.json"
          if [ ! -f "$RESULTS_FILE" ]; then
            echo "No results.json for branch ${SAFE_BRANCH}; skipping canary gate"
            exit 0
          fi
          uv run python -m scripts.canary_gate --results "$RESULTS_FILE"

      - name: Post diff as PR comment
        if: always() && github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_REF: ${{ github.head_ref }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
          WORKSPACE: ${{ github.workspace }}
        run: |
          set -euo pipefail
          SAFE_BRANCH=$(uv run python -c "import sys; from scripts.benchmark import sanitize_branch; print(sanitize_branch(sys.argv[1]))" "$HEAD_REF")
          DIFF_FILE="$WORKSPACE/task2/benchmark/${SAFE_BRANCH}/diff.md"
          if [ ! -f "$DIFF_FILE" ] || [ ! -s "$DIFF_FILE" ]; then
            echo "No diff.md found for branch ${SAFE_BRANCH}; skipping PR comment"
            exit 0
          fi
          gh pr comment "$PR_NUMBER" \
            --edit-last --body-file "$DIFF_FILE" \
            --repo "$REPO" 2>/dev/null \
          || gh pr comment "$PR_NUMBER" \
            --body-file "$DIFF_FILE" \
            --repo "$REPO"
