name: task2 benchmark

on:
  pull_request:
    branches: [master]
    paths:
      - 'task2/**'
      - '.github/workflows/task2-benchmark.yml'

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: task2-benchmark-${{ github.head_ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: task2
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: task2/uv.lock

      - name: Set up Python
        run: uv python install 3.11

      - name: Install dependencies
        run: uv sync --frozen

      - name: Resolve merge-base date
        id: base
        working-directory: ${{ github.workspace }}
        run: |
          git fetch origin master --depth=0 || git fetch origin master
          base_sha=$(git merge-base origin/master HEAD)
          base_date=$(git show -s --format=%cI "$base_sha")
          echo "Merge-base $base_sha at $base_date"
          echo "date=$base_date" >> "$GITHUB_OUTPUT"

      - name: Verify benchmark recorded for branch
        run: >
          uv run python -m scripts.benchmark
          --branch "${{ github.head_ref }}"
          --verify "${{ steps.base.outputs.date }}"

      - name: Post diff as PR comment
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          SAFE_BRANCH=$(uv run python -c "import sys; from scripts.benchmark import sanitize_branch; print(sanitize_branch(sys.argv[1]))" "${{ github.head_ref }}")
          DIFF_FILE="${{ github.workspace }}/task2/benchmark/${SAFE_BRANCH}/diff.md"
          if [ ! -f "$DIFF_FILE" ] || [ ! -s "$DIFF_FILE" ]; then
            echo "No diff.md found for branch ${SAFE_BRANCH}; skipping PR comment"
            exit 0
          fi
          gh pr comment "${{ github.event.pull_request.number }}" \
            --edit-last --body-file "$DIFF_FILE" \
            --repo "${{ github.repository }}" 2>/dev/null \
          || gh pr comment "${{ github.event.pull_request.number }}" \
            --body-file "$DIFF_FILE" \
            --repo "${{ github.repository }}"
