<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>L4 No Metadata</title>
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
      }
      #target {
        position: fixed;
        left: 100px;
        top: 200px;
        width: 80px;
        height: 40px;
        background: #4a90e2;
        outline: none;
      }
      #target:focus {
        outline: none;
      }
    </style>
  </head>
  <body>
    <div id="target"></div>
    <script>
      document.addEventListener('click', function (e) {
        window.__l4_click = {
          x: e.clientX,
          y: e.clientY,
          target: e.target && e.target.id ? e.target.id : '',
        };
      });
    </script>
  </body>
</html>
