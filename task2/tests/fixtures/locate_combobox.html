<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8"><title>Combobox Search</title></head>
<body>
  <h1>Search</h1>
  <!-- Mirrors Google Maps / Google search homepage shape: an editable
       combobox without a real <input> element. -->
  <div role="combobox" aria-label="Search" contenteditable="true" id="cb"></div>
</body>
</html>
