[project]
name = "vici"
version = "0.0.0"
description = "AI Coding Test — Tasks 1, 2, 3"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "playwright>=1.58.0",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "respx>=0.21",
    "ruff>=0.6",
]

[tool.setuptools.packages.find]
include = ["agent*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --cov=agent --cov-report=term-missing"

[tool.coverage.run]
branch = true
source = ["agent"]

[tool.coverage.report]
show_missing = true
skip_covered = false

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
